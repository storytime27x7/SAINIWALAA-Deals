<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g transform="translate(100, 140)">
    <!-- Brand Icon -->
    <rect width="120" height="120" rx="28" fill="#F59E0B" />
    <path d="M40 50h40l-4 38H44L40 50z" fill="#0F172A" />
    <path d="M50 50c0-8 4.5-14 10-14s10 6 10 14" stroke="#0F172A" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <!-- Brand Text -->
    <text x="150" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="1">SAINIWALAA <tspan fill="#F59E0B">DEALS</tspan></text>
    <text x="150" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#94A3B8">India's Smart Shopping Companion</text>
  </g>
  <!-- Main Heading -->
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF">Amazon, Flipkart &amp; Meesho Best Deals</text>
  <text x="100" y="395" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#CBD5E1">Verified price drops, coupons, and top handpicked discounts in one place.</text>
  <!-- Badges -->
  <g transform="translate(100, 460)">
    <rect width="210" height="48" rx="12" fill="#FF9900" />
    <text x="105" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#0F172A" text-anchor="middle">Amazon India</text>
    
    <rect x="230" width="180" height="48" rx="12" fill="#2874F0" />
    <text x="320" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">Flipkart</text>

    <rect x="430" width="180" height="48" rx="12" fill="#F43397" />
    <text x="520" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">Meesho</text>

    <rect x="630" width="230" height="48" rx="12" fill="#10B981" />
    <text x="745" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">100% Free Service</text>
  </g>
